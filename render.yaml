# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# BalanceVault — Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: balancevault-postgres
    databaseName: balancevault
    user: balancevault_app
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ── Redis (Rate Limiting & Sessions) ──────────────────────────────
  - type: redis
    name: balancevault-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── Backend API ───────────────────────────────────────────────────
  - type: web
    name: balancevault-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: balancevault-postgres
          property: connectionString
      - key: DATABASE_URL_MIGRATE
        fromDatabase:
          name: balancevault-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: balancevault-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "1h"

  # ── Frontend (Nginx + React SPA) ─────────────────────────────────
  - type: web
    name: balancevault-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: PORT
        value: "80"
