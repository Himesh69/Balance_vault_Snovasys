services:
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    restart: always
    environment:
      POSTGRES_USER: balancevault
      POSTGRES_PASSWORD: balancevault_root_pass
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancevault -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balancevault-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://balancevault_app:app_secret_pass@postgres:5432/balancevault?schema=public
      DATABASE_URL_MIGRATE: postgresql://balancevault_migrator:migrator_secret_pass@postgres:5432/balancevault?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secure_jwt_secret_balancevault_2026
      JWT_EXPIRES_IN: 1h

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balancevault-frontend
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:

