# BalanceVault — Production & Deployment Docker Compose Specification
# Architecture:
#   - postgres: PostgreSQL 16 Alpine with separate DDL (migrator) & DML (app) roles
#   - redis: Redis 7 Alpine with AOF persistence for distributed rate limiting
#   - api: Node.js 22 Alpine API server with automated Prisma migration deploy & healthcheck
#   - frontend: Nginx Alpine reverse-proxying SPA routes & API endpoints on port 3000

services:
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balancevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-balancevault_root_pass}
      POSTGRES_DB: ${POSTGRES_DB:-balancevault}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancevault -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - balancevault_network

  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - balancevault_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balancevault-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://balancevault_app:app_secret_pass@postgres:5432/balancevault?schema=public
      DATABASE_URL_MIGRATE: postgresql://balancevault_migrator:migrator_secret_pass@postgres:5432/balancevault?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secure_jwt_secret_balancevault_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - balancevault_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balancevault-frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - balancevault_network

volumes:
  postgres_data:
    name: balancevault_postgres_data
  redis_data:
    name: balancevault_redis_data

networks:
  balancevault_network:
    name: balancevault_network
    driver: bridge
