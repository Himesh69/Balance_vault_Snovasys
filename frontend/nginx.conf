server {
    listen 80;
    server_name localhost;

    # Dynamic DNS resolver
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json font/woff font/woff2;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxies to Render Backend
    location /auth/ {
        proxy_pass https://balancevault-api-frjw.onrender.com/auth/;
        proxy_set_header Host balancevault-api-frjw.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /onboarding/ {
        proxy_pass https://balancevault-api-frjw.onrender.com/onboarding/;
        proxy_set_header Host balancevault-api-frjw.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /accounts/ {
        proxy_pass https://balancevault-api-frjw.onrender.com/accounts/;
        proxy_set_header Host balancevault-api-frjw.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass https://balancevault-api-frjw.onrender.com/admin/;
        proxy_set_header Host balancevault-api-frjw.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass https://balancevault-api-frjw.onrender.com/api/;
        proxy_set_header Host balancevault-api-frjw.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass https://balancevault-api-frjw.onrender.com/health;
        proxy_set_header Host balancevault-api-frjw.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
